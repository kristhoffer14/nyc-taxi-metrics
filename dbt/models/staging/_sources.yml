version: 2

sources:
  - name: raw
    description: >
      Tables written by the Python loader (pipeline/load.py). Source values are
      kept as delivered by the TLC, cast to one fixed schema per column.
    schema: raw
    tables:
      - name: yellow_trips
        description: One row per trip record in a TLC yellow taxi monthly Parquet file.
        columns:
          - name: vendorid
            description: TPEP provider code (1 CMT, 2 Curb, 6 Myle, 7 Helix).
          - name: tpep_pickup_datetime
            description: Meter engaged timestamp (local time, no time zone).
          - name: tpep_dropoff_datetime
            description: Meter disengaged timestamp (local time, no time zone).
          - name: passenger_count
            description: Driver-entered passenger count. NULL when payment_type = 0.
          - name: trip_distance
            description: Trip distance in miles reported by the taximeter.
          - name: ratecodeid
            description: Final rate code (1 standard, 2 JFK, 3 Newark, 4 Nassau/Westchester, 5 negotiated, 6 group, 99 unknown).
          - name: store_and_fwd_flag
            description: Y if the record was held in vehicle memory before sending.
          - name: pulocationid
            description: TLC taxi zone where the meter was engaged.
          - name: dolocationid
            description: TLC taxi zone where the meter was disengaged.
          - name: payment_type
            description: Payment code (0 flex fare, 1 credit card, 2 cash, 3 no charge, 4 dispute, 5 unknown, 6 voided).
          - name: fare_amount
            description: Time-and-distance fare in USD.
          - name: extra
            description: Miscellaneous extras and surcharges in USD.
          - name: mta_tax
            description: MTA tax in USD.
          - name: tip_amount
            description: Tip in USD. Recorded for credit-card tips only; cash tips are not captured.
          - name: tolls_amount
            description: Tolls paid in USD.
          - name: improvement_surcharge
            description: Improvement surcharge in USD.
          - name: total_amount
            description: Total charged to the passenger in USD, excluding cash tips.
          - name: congestion_surcharge
            description: NYS congestion surcharge in USD.
          - name: airport_fee
            description: Airport fee for LaGuardia and JFK pickups in USD (Airport_fee in the source).
          - name: cbd_congestion_fee
            description: MTA congestion relief zone toll in USD. NULL for months before 2025, whose files lack the column.
          - name: source_month
            description: Month (YYYY-MM) of the file the row was loaded from.
            data_tests: [not_null]
          - name: source_file
            description: Name of the file the row was loaded from.
            data_tests: [not_null]
          - name: source_row
            description: 1-based position of the row in its source file.
            data_tests: [not_null]

      - name: taxi_zones
        description: TLC taxi zone lookup (taxi_zone_lookup.csv).
        columns:
          - name: LocationID
            description: Taxi zone ID.
          - name: Borough
            description: Borough name; includes EWR, Unknown and N/A.
          - name: Zone
            description: Zone name.
          - name: service_zone
            description: Service zone (Yellow Zone, Boro Zone, Airports, EWR, N/A).

      - name: load_log
        description: One row per loaded month, written by the loader for idempotency.
        columns:
          - name: source_month
            description: Loaded month (YYYY-MM).
            data_tests: [unique, not_null]
          - name: source_file
            description: File the month was loaded from.
          - name: row_count
            description: Rows inserted for the month.
          - name: loaded_at
            description: When the month was loaded.
