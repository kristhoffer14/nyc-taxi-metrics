version: 2

models:
  - name: stg_taxi_zones
    description: TLC taxi zones, renamed.
    columns:
      - name: location_id
        description: Taxi zone ID.
        data_tests: [unique, not_null]
      - name: borough
        description: Borough; EWR, Unknown (zone 264) and N/A (zone 265) are kept as their own values.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Bronx, Brooklyn, EWR, Manhattan, "N/A", Queens, Staten Island, Unknown]
      - name: zone_name
        description: Zone name.
      - name: service_zone
        description: Service zone (Yellow Zone, Boro Zone, Airports, EWR, N/A).

  - name: stg_yellow_trips_classified
    description: |
      Every raw trip, typed and renamed, with reject_reason set to the first
      staging rule it breaks (NULL for valid trips).

      Reject rules, checked in this order (a trip gets the first one it breaks):
      1. missing_required_value: pickup, dropoff, fare, total or distance is NULL.
      2. negative_amount: fare_amount < 0 or total_amount < 0 (refunds and adjustments).
      3. non_positive_duration: dropoff at or before pickup.
      4. excessive_duration: dropoff more than var max_trip_duration_hours (24) after pickup.
      5. pickup_outside_source_month: pickup month differs from the file's month.
      6. invalid_distance: distance < 0 or above var max_trip_distance_miles (100).
         Zero-distance trips are kept; fare per mile excludes them.
      7. unknown_zone: pickup or dropoff zone not in the zone lookup (zones 264 Unknown
         and 265 Outside of NYC are in the lookup and therefore valid).
    columns:
      - name: trip_id
        description: "Trip key: source_month and the zero-padded row position in the source file."
        data_tests:
          - unique
          - not_null
      - name: source_month
        description: "Month (YYYY-MM) of the file the trip was loaded from."
        data_tests:
          - not_null
      - name: source_file
        description: "Name of the file the trip was loaded from."
      - name: source_row
        description: "1-based position of the trip in its source file."
      - name: vendor_id
        description: "TPEP provider code (1 CMT, 2 Curb, 6 Myle, 7 Helix)."
      - name: pickup_at
        description: "Meter engaged timestamp (local time)."
      - name: dropoff_at
        description: "Meter disengaged timestamp (local time)."
      - name: passenger_count
        description: "Driver-entered passenger count. NULL when payment_type = 0."
      - name: trip_distance_miles
        description: "Taximeter trip distance in miles."
      - name: rate_code_id
        description: "Final rate code; 99 means unknown."
      - name: store_and_fwd_flag
        description: "Y if the record was held in vehicle memory before sending."
      - name: pickup_location_id
        description: "Pickup taxi zone ID."
      - name: dropoff_location_id
        description: "Dropoff taxi zone ID."
      - name: payment_type
        description: "Payment code (0 flex fare, 1 credit card, 2 cash, 3 no charge, 4 dispute, 5 unknown, 6 voided)."
      - name: fare_amount
        description: "Time-and-distance fare in USD."
      - name: extra_amount
        description: "Miscellaneous extras and surcharges in USD."
      - name: mta_tax_amount
        description: "MTA tax in USD."
      - name: tip_amount
        description: "Tip in USD; credit-card tips only."
      - name: tolls_amount
        description: "Tolls in USD."
      - name: improvement_surcharge_amount
        description: "Improvement surcharge in USD."
      - name: total_amount
        description: "Total charged in USD, excluding cash tips."
      - name: congestion_surcharge_amount
        description: "NYS congestion surcharge in USD."
      - name: airport_fee_amount
        description: "Airport fee in USD."
      - name: cbd_congestion_fee_amount
        description: "MTA congestion relief zone toll in USD; NULL before 2025."
      - name: reject_reason
        description: "First staging rule the trip breaks, NULL if none. Rules are checked in the order listed on stg_yellow_trips_classified."
        data_tests:
          - accepted_values:
              arguments:
                values: [missing_required_value, negative_amount, non_positive_duration, excessive_duration, pickup_outside_source_month, invalid_distance, unknown_zone]

  - name: stg_yellow_trips
    description: Valid trips, those with no reject_reason. Downstream models read only this.
    columns:
      - name: trip_id
        description: "Trip key: source_month and the zero-padded row position in the source file."
        data_tests:
          - unique
          - not_null
      - name: source_month
        description: "Month (YYYY-MM) of the file the trip was loaded from."
        data_tests:
          - not_null
      - name: source_file
        description: "Name of the file the trip was loaded from."
      - name: source_row
        description: "1-based position of the trip in its source file."
      - name: vendor_id
        description: "TPEP provider code (1 CMT, 2 Curb, 6 Myle, 7 Helix)."
      - name: pickup_at
        description: "Meter engaged timestamp (local time)."
        data_tests:
          - not_null
      - name: dropoff_at
        description: "Meter disengaged timestamp (local time)."
        data_tests:
          - not_null
      - name: passenger_count
        description: "Driver-entered passenger count. NULL when payment_type = 0."
      - name: trip_distance_miles
        description: "Taximeter trip distance in miles."
      - name: rate_code_id
        description: "Final rate code; 99 means unknown."
      - name: store_and_fwd_flag
        description: "Y if the record was held in vehicle memory before sending."
      - name: pickup_location_id
        description: "Pickup taxi zone ID."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_taxi_zones')
                field: location_id
      - name: dropoff_location_id
        description: "Dropoff taxi zone ID."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_taxi_zones')
                field: location_id
      - name: payment_type
        description: "Payment code (0 flex fare, 1 credit card, 2 cash, 3 no charge, 4 dispute, 5 unknown, 6 voided)."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
                quote: false
      - name: fare_amount
        description: "Time-and-distance fare in USD."
      - name: extra_amount
        description: "Miscellaneous extras and surcharges in USD."
      - name: mta_tax_amount
        description: "MTA tax in USD."
      - name: tip_amount
        description: "Tip in USD; credit-card tips only."
      - name: tolls_amount
        description: "Tolls in USD."
      - name: improvement_surcharge_amount
        description: "Improvement surcharge in USD."
      - name: total_amount
        description: "Total charged in USD, excluding cash tips."
      - name: congestion_surcharge_amount
        description: "NYS congestion surcharge in USD."
      - name: airport_fee_amount
        description: "Airport fee in USD."
      - name: cbd_congestion_fee_amount
        description: "MTA congestion relief zone toll in USD; NULL before 2025."

  - name: stg_yellow_trips_rejected
    description: Invalid trips with the first staging rule each one breaks. Kept for auditing and the reconciliation test.
    columns:
      - name: trip_id
        description: "Trip key: source_month and the zero-padded row position in the source file."
        data_tests:
          - unique
          - not_null
      - name: source_month
        description: "Month (YYYY-MM) of the file the trip was loaded from."
        data_tests:
          - not_null
      - name: source_file
        description: "Name of the file the trip was loaded from."
      - name: source_row
        description: "1-based position of the trip in its source file."
      - name: vendor_id
        description: "TPEP provider code (1 CMT, 2 Curb, 6 Myle, 7 Helix)."
      - name: pickup_at
        description: "Meter engaged timestamp (local time)."
      - name: dropoff_at
        description: "Meter disengaged timestamp (local time)."
      - name: passenger_count
        description: "Driver-entered passenger count. NULL when payment_type = 0."
      - name: trip_distance_miles
        description: "Taximeter trip distance in miles."
      - name: rate_code_id
        description: "Final rate code; 99 means unknown."
      - name: store_and_fwd_flag
        description: "Y if the record was held in vehicle memory before sending."
      - name: pickup_location_id
        description: "Pickup taxi zone ID."
      - name: dropoff_location_id
        description: "Dropoff taxi zone ID."
      - name: payment_type
        description: "Payment code (0 flex fare, 1 credit card, 2 cash, 3 no charge, 4 dispute, 5 unknown, 6 voided)."
      - name: fare_amount
        description: "Time-and-distance fare in USD."
      - name: extra_amount
        description: "Miscellaneous extras and surcharges in USD."
      - name: mta_tax_amount
        description: "MTA tax in USD."
      - name: tip_amount
        description: "Tip in USD; credit-card tips only."
      - name: tolls_amount
        description: "Tolls in USD."
      - name: improvement_surcharge_amount
        description: "Improvement surcharge in USD."
      - name: total_amount
        description: "Total charged in USD, excluding cash tips."
      - name: congestion_surcharge_amount
        description: "NYS congestion surcharge in USD."
      - name: airport_fee_amount
        description: "Airport fee in USD."
      - name: cbd_congestion_fee_amount
        description: "MTA congestion relief zone toll in USD; NULL before 2025."
      - name: reject_reason
        description: "First staging rule the trip breaks, NULL if none. Rules are checked in the order listed on stg_yellow_trips_classified."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [missing_required_value, negative_amount, non_positive_duration, excessive_duration, pickup_outside_source_month, invalid_distance, unknown_zone]
