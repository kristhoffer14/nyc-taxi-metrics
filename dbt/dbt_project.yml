name: nyc_taxi_metrics
version: "1.0.0"
config-version: 2
profile: nyc_taxi_metrics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

models:
  nyc_taxi_metrics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      +contract:
        enforced: true

vars:
  # Staging reject thresholds, documented in models/staging/_staging.yml.
  max_trip_distance_miles: 100
  max_trip_duration_hours: 24
